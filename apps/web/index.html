<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0b1026" />
    <title>NimWorld</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@500;600;700;800&family=Sora:wght@600;700;800&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070b1a;
        color: #f4f6ff;
        font-family: Mulish, system-ui, sans-serif;
      }
      #boot-shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          linear-gradient(180deg, rgba(7, 11, 26, 0.62), rgba(7, 11, 26, 0.35) 40%, rgba(7, 11, 26, 0.85)),
          url('/assets/art/ui/boot_keyart_v01_final.png') center / cover no-repeat,
          #070b1a;
        image-rendering: pixelated;
      }
      #boot-shell .plate {
        width: min(23rem, calc(100vw - 2rem));
        padding: 1rem 1.1rem;
        text-align: center;
        background: rgba(12, 18, 42, 0.94);
        border: 3px solid #5b6ea8;
        box-shadow: inset 0 0 0 2px #0a0f24, 0 6px 0 rgba(4, 7, 18, 0.55);
        clip-path: polygon(
          8px 0,
          calc(100% - 8px) 0,
          100% 8px,
          100% calc(100% - 8px),
          calc(100% - 8px) 100%,
          8px 100%,
          0 calc(100% - 8px),
          0 8px
        );
      }
      #boot-shell .brand {
        margin: 0;
        font-family: 'Press Start 2P', Sora, system-ui, sans-serif;
        font-size: clamp(1.05rem, 5.2vw, 1.6rem);
        line-height: 1.35;
        color: #f5a623;
        text-shadow: 0 3px 0 #3a2404;
      }
      #boot-shell .tag {
        margin: 0.65rem 0 0;
        color: #a8b3d9;
        font-size: 0.85rem;
      }
      #boot-shell .status {
        margin: 1.1rem 0 0;
        font-family: 'Press Start 2P', Sora, system-ui, sans-serif;
        font-size: 0.66rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="boot-shell" aria-hidden="true">
      <div class="plate">
        <p class="brand">NIMWORLD</p>
        <p class="tag">Your identity. Your apps. Your plaza.</p>
        <p class="status">Connecting…</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
