<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0b1026" />
    <title>NimWorld</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070b1a;
        color: #f4f6ff;
        font-family: Mulish, system-ui, sans-serif;
      }
      #boot-shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(900px 520px at 50% 18%, rgba(88, 196, 255, 0.16), transparent 58%),
          radial-gradient(700px 480px at 50% 72%, rgba(155, 123, 255, 0.14), transparent 55%),
          radial-gradient(1200px 800px at 50% 100%, #121a3a 0%, #070b1a 62%);
      }
      #boot-shell .brand {
        margin: 0;
        font-family: Sora, system-ui, sans-serif;
        font-size: clamp(2rem, 7vw, 2.75rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #f5a623;
        text-align: center;
      }
      #boot-shell .tag {
        margin: 0.4rem 0 0;
        color: #a8b3d9;
        text-align: center;
        font-size: 0.92rem;
      }
      #boot-shell .status {
        margin: 1.4rem 0 0;
        text-align: center;
        font-weight: 600;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div id="boot-shell" aria-hidden="true">
      <div>
        <p class="brand">NimWorld</p>
        <p class="tag">Your identity. Your apps. Your plaza.</p>
        <p class="status">Connecting…</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
