server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors the Vite dev proxy (apps/web/vite.config.ts) so the built
    # site keeps working without its own backend.
    location /catalog-api/ {
        proxy_pass https://api.nimiqminiapps.com/;
        proxy_set_header Host api.nimiqminiapps.com;
    }

    location /auth-api/ {
        proxy_pass http://api:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
