services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-dev-insecure-session-secret}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${PORT:-8090}:80'
    depends_on:
      - api
